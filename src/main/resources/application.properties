# ---------------------------------------------------------------
# 공통 설정 (커밋함). DB 비밀번호·JWT 비밀키는 application-local.properties 에 (커밋 금지)
#   src/main/resources/application-local.properties 을 복사해서 만든다
# ---------------------------------------------------------------
spring.application.name=escaplix-backend
spring.config.import=optional:classpath:application-local.properties
server.port=8081

# JPA: 테이블은 sql/create_tables.sql 로 만든다 (JPA 가 만들거나 바꾸지 않음)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Oracle 11g: 기본 OracleDialect 는 19 이상용(FETCH FIRST 등) -> 11g 에서 ORA-00933. 11g 문법(ROWNUM)을 쓰는 방언으로 고정
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect

# 파일 올리기 (사진 5MB, 한 요청 12MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
app.upload.public-dir=uploads
app.upload.private-dir=private

# 프런트 (Live Server)
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500

# 메일 (이메일 인증번호). 계정 spring.mail.username·password 는 local 파일에
#   비어 있으면 메일을 보내지 않고 인증번호를 서버 콘솔에 찍는다 (개발 모드)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# JWT 유효 시간 (분). 비밀키 jwt.secret 은 local 파일에
jwt.expiration-minutes=30
# Refresh Token 유효 기간 (일). 쿠키(HttpOnly)로 주고 DB 에는 해시만. 쓸 때마다 새로 바뀜
jwt.refresh-days=7
