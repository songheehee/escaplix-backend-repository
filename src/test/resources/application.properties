# 테스트 전용: Oracle 없이 H2 메모리 DB 로 스프링이 뜨는지(엔티티·리포지토리·컨트롤러 매핑)만 확인
spring.datasource.url=jdbc:h2:mem:escaplix;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
app.upload.public-dir=build/test-uploads
app.upload.private-dir=build/test-private
app.cors.allowed-origins=http://127.0.0.1:5500
jwt.secret=test-secret-test-secret-test-secret-123
jwt.expiration-minutes=60
